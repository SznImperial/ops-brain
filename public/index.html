<!doctype html><html><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Ops Brain — Graph Hacks</title>
<style>
:root{--y:#FFDE59;--p:#FF90E8;--c:#7DF9FF;--k:#111}
*{box-sizing:border-box;font-family:Verdana,system-ui,sans-serif}
body{background:#FFF6E5;color:var(--k);margin:0;padding:24px}
.wrap{max-width:900px;margin:0 auto}
.badge{display:inline-block;background:var(--k);color:#fff;padding:6px 12px;border:3px solid var(--k);box-shadow:4px 4px 0 var(--p);font-weight:700}
h1{font-size:44px;margin:14px 0;text-transform:uppercase;text-shadow:3px 3px 0 var(--c)}
.card{background:#fff;border:4px solid var(--k);box-shadow:8px 8px 0 var(--k);padding:18px;margin:16px 0}
.card.t1{box-shadow:8px 8px 0 #FF4911}.card.t2{box-shadow:8px 8px 0 #7DF9FF}.card.t3{box-shadow:8px 8px 0 #FFDE59}
input,button{border:3px solid var(--k);padding:12px;font-size:16px}
input{width:70%;background:#fff}button{background:var(--y);font-weight:800;cursor:pointer;box-shadow:4px 4px 0 var(--k)}
button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--k)}
pre{background:var(--k);color:#7DF9FF;padding:12px;overflow:auto;white-space:pre-wrap}
.row{display:flex;gap:8px;flex-wrap:wrap}
</style></head><body><div class="wrap">
<span class="badge">GRAPH HACKS ★ T1+T2+T3</span>
<h1>Ops Brain</h1>
<p><b>Company Brain that remembers + acts.</b> FalkorDB is the brain, not decoration. Every answer shows its path.</p>
<div class="card t3"><h3>🧠 T3 — Who knows it?</h3><div class="row"><input id="q" value="payments-api"/><button onclick="ask()">ASK</button></div><pre id="o1">Hit ASK</pre></div>
<div class="card t1"><h3>⚡ T1 — Blast radius</h3><div class="row"><input id="s" value="payments-api"/><button onclick="blast()">BLAST</button></div><pre id="o2">Hit BLAST</pre></div>
<div class="card t2"><h3>🤖 T2 — Memory + handoff</h3><div class="row"><input id="m" value="who owns payments-api?"/><button onclick="mem()">REMEMBER</button><button onclick="hand()">HANDOFF</button></div><pre id="o3">Hit REMEMBER</pre></div>
<script>
const j = async (u)=> (await fetch(u)).json();
async function ask(){o1.textContent='...';o1.textContent=JSON.stringify(await j('/.netlify/functions/ask?q='+encodeURIComponent(q.value)),null,2)}
async function blast(){o2.textContent='...';o2.textContent=JSON.stringify(await j('/.netlify/functions/blast?system='+encodeURIComponent(s.value)),null,2)}
async function mem(){o3.textContent='...';o3.textContent=JSON.stringify(await j('/.netlify/functions/memory?uid=u1&q='+encodeURIComponent(m.value)),null,2)}
async function hand(){o3.textContent='...';o3.textContent=JSON.stringify(await j('/.netlify/functions/handoff?ticket=PAY-101'),null,2)}
</script></div></body></html>
